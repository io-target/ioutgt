# vmtest config for ioutgt's VM tests -- the default used by
# testing/run_*.sh (see vmtest.sh, next to this file).
#
# Lives in the repo so a checkout is self-describing: the settings the
# ioutgt guest tests actually depend on are recorded here rather than in
# a private per-machine file. Everything machine-specific comes from the
# environment instead.
#
# vt_load_config resolves each knob as: environment > this file >
# built-in default. So any line below can be overridden per run:
#
#   KERNEL_DIR=~/git/linux-next testing/run_interop.sh
#   VMTEST_NUMA_NODES=1 testing/run_interop.sh
#
# Kernel tree to boot. Machine-specific, so it comes from the shell; the
# fallback just keeps the common case working with no env set.
KERNEL_DIR="${KERNEL_DIR:-$HOME/git/linux-ioutgt}"

# Multi-NUMA guest. testing/run_affinity.sh needs > 1 node to have
# anything to check (spread_cpus placement is per-node); the other tests
# are indifferent.
VMTEST_NUMA_NODES="${VMTEST_NUMA_NODES:-4}"

# User-mode networking: the guest reaches the host-side target at
# 10.0.2.2, which is how every NVMe/TCP test connects. NET2 adds the
# second interface the two-NIC tests use.
VMTEST_NET="${VMTEST_NET:-1}"
VMTEST_NET2="${VMTEST_NET2:-1}"
