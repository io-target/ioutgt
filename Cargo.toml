[workspace]
resolver = "2"
members = [
    "crates/ioutgt-uring",
    "crates/ioutgt-nvme",
    "crates/ioutgt-cpus",
    "crates/ioutgt-core",
    "crates/ioutgt-stream",
    "crates/ioutgt-nvme-tcp",
    "crates/ioutgt-backend",
    "crates/ioutgt-control",
    "crates/ioutgt-harness",
    "crates/ioutgt-nvme-rdma",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/io-target/ioutgt"
authors = ["Ming Lei <tom.leiming@gmail.com>"]
description = "Userspace NVMe/TCP storage target built on io_uring"
keywords = ["nvme", "nvme-tcp", "io-uring", "storage", "target"]
categories = ["network-programming", "asynchronous", "os::linux-apis"]

[workspace.dependencies]
# intra-workspace
ioutgt-uring = { path = "crates/ioutgt-uring" }
ioutgt-nvme = { path = "crates/ioutgt-nvme" }
ioutgt-cpus = { path = "crates/ioutgt-cpus" }
ioutgt-core = { path = "crates/ioutgt-core" }
ioutgt-stream = { path = "crates/ioutgt-stream" }
ioutgt-nvme-tcp = { path = "crates/ioutgt-nvme-tcp" }
ioutgt-backend = { path = "crates/ioutgt-backend" }
ioutgt-control = { path = "crates/ioutgt-control" }
ioutgt-harness = { path = "crates/ioutgt-harness" }

# external
io-uring = "0.7"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
slab = "0.4"
zerocopy = { version = "0.8", features = ["derive"] }
# NVMe/TCP digests (CRC32C): folds with pclmulqdq/vpclmulqdq, ~1.6x the
# crc32c crate built with +sse4.2 on the DDGST path. See the module docs in
# crates/ioutgt-nvme/src/digest.rs.
# Do not drop `std` to trim the tree: it gates the SIMD dispatch itself
# (`is_x86_feature_detected!` needs it), so without it every digest falls
# back to a byte-at-a-time table -- and on x86_64 crc-fast does not even
# compile, its arch backend importing `std::arch` rather than `core::arch`.
# `["std"]` is minimal; default-features off drops only `ffi`/`panic-handler`.
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe ibverbs + RDMA-CM bindings linking the system rdma-core (see
# crates/ioutgt-nvme-rdma + docs/nvme-rdma.md for why not ibverbs-sys/rdma-sys).
# Pinned exactly: cm.rs bridges a raw `ibv_context` into sideway's
# `DeviceContext` with a layout-asserted transmute (single-field struct in
# 0.4.3) — revisit `CmId::get_device_context` on any upgrade.
sideway = "=0.4.3"
# sideway's raw FFI backend — used directly for the CQ-event calls sideway does
# not wrap (req_notify/get_cq_event/ack); pinned to sideway's version so the
# ibv_cq / ibv_comp_channel types unify.
rdma-mummy-sys = "0.2.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
core_affinity = "0.8"
tokio = { version = "1", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
must_use_candidate = "allow"

# Performance-sensitive project: keep debug info in release builds for
# perf/flamegraph work; thin LTO is close to fat LTO here at a fraction
# of the link time.
[profile.release]
lto = "thin"
debug = true
codegen-units = 1

[profile.bench]
inherits = "release"

